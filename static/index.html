<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step by Step - learn it one checked step at a time</title>
<style>
:root{--ink:#1c1c1e;--mute:#6e6e73;--acc:#0a6cff;--ok:#1a8f4c;--warn:#a85a00;--line:rgba(60,60,67,.14);--glass:rgba(255,255,255,.72);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{background:#1b1340}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;
background:radial-gradient(1100px 700px at 12% 8%,#ff9a62 0%,transparent 60%),radial-gradient(900px 700px at 88% 14%,#6a5cff 0%,transparent 62%),radial-gradient(1000px 800px at 70% 100%,#ff4f8b 0%,transparent 60%),radial-gradient(900px 700px at 0% 100%,#2a9dff 0%,transparent 60%),#2b1a6b;background-attachment:fixed}
main{max-width:820px;margin:28px auto 80px;padding:0 14px}
.win{background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.55);border-radius:16px;box-shadow:0 30px 80px rgba(20,10,60,.45),0 2px 6px rgba(0,0,0,.2);overflow:hidden}
.bar-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.45)}
.bar-top i{width:12px;height:12px;border-radius:50%;display:block}.bar-top i:nth-child(1){background:#ff5f57}.bar-top i:nth-child(2){background:#febc2e}.bar-top i:nth-child(3){background:#28c840}
.bar-top b{flex:1;text-align:center;font-weight:600;font-size:13px;color:#3a3a3c;margin-right:44px}
.body{padding:28px 28px 34px}
.hero h1{font-size:44px;line-height:1.05;margin:6px 0 10px;letter-spacing:-.035em;font-weight:700}
.hero .sub{font-size:17px;color:var(--mute);margin:0 0 24px;max-width:560px;letter-spacing:-.01em}
.row{display:flex;gap:10px}
input[type=text]{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font:16px var(--font);background:rgba(255,255,255,.9);outline:none;transition:box-shadow .15s,border-color .15s}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(10,108,255,.18)}
button{border:0;border-radius:10px;padding:12px 18px;background:var(--acc);color:#fff;font:600 15px var(--font);cursor:pointer;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.985)}
button.ghost{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid var(--line)}button.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:30px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}.chip{background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:500;font-size:14px}
.card{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.warn{background:#fff6e8;border-color:#f3d6a6}.warn h3{color:var(--warn);margin:0 0 6px;font-size:14px;letter-spacing:-.005em}.warn ul{margin:0;padding-left:20px}
.meta{font-size:13px;color:var(--mute)}.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#e8f0ff;color:#1b4fc2;margin-right:6px}
.badge.g{background:#e3f6ea;color:#14663a}.badge.r{background:#fde8e6;color:#a4231a}
.bar{height:6px;background:rgba(60,60,67,.12);border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.step{display:flex;gap:14px;align-items:flex-start}.step.done .t{text-decoration:line-through;color:var(--mute)}.step.cur{box-shadow:0 0 0 2px var(--acc)}
.step input{width:22px;height:22px;margin-top:3px;accent-color:var(--ok)}.t{font-weight:650;font-size:16px;letter-spacing:-.012em}.d{margin:2px 0 8px;color:#3a3a3c}
details{margin-top:6px}summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:500}.ev{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.ask{margin-top:8px}.ans{white-space:pre-wrap;background:rgba(10,108,255,.07);border-radius:10px;padding:12px;margin-top:8px;font-size:14px}
.trace{font:12px/1.55 ui-monospace,"SF Mono",Menlo,monospace;background:#16161a;color:#c9d4df;border-radius:12px;padding:12px;overflow:auto;white-space:pre-wrap}
.card input[type=text]{width:100%;margin-top:8px;padding:10px 12px;font-size:14px}
.chip{padding:8px 16px}
.hidden{display:none}.err{background:#fde8e6;border-color:#f3b4ae;color:#7a1c14}
@media(max-width:560px){.body{padding:20px 16px 26px}.hero h1{font-size:34px}main{margin-top:10px}}
</style></head><body><main><div class="win">
<div class="bar-top"><i></i><i></i><i></i><b>Step by Step</b></div>
<div class="body">
<div class="hero"><h1>Step by Step</h1><p class="sub">Learn anything hands-on, one checked step at a time. Warnings first, help when you're stuck, a 3D preview for paper folds.</p></div>
<div class="row"><input id="q" type="text" placeholder="Paste a link or type a topic"><button id="go">Teach me</button></div>
<h2 class="sec">Try a built-in guide</h2><div class="chips" id="chips"></div>
<div id="status" class="meta"></div>
<div id="out"></div>
</div></div></main>
<script src="presets.js"></script><script src="app.js"></script></body></html>
