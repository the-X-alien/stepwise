<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stepwise - learn it one checked step at a time</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--acc:#2f5bea;--ok:#1f9d55;--warn:#b45309;--line:#e4e2da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}h1{font-size:28px;margin:8px 0 2px}.sub{color:var(--mute);margin:0 0 18px}
.row{display:flex;gap:8px}input[type=text]{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.sm{padding:7px 11px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}.chip{background:#fff;border:1px solid var(--line);color:var(--ink);padding:9px 13px;border-radius:999px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}h1{letter-spacing:-.02em}.hero{background:linear-gradient(135deg,#2f5bea,#7a4cf0);color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:16px}.hero h1{margin:0}.hero .sub{color:#e6e9ff;margin:4px 0 0}.step.done{opacity:.7}.chip:hover{border-color:var(--acc)}h2.sec{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 0}
.warn{background:#fff7ed;border-color:#fed7aa}.warn h3{color:var(--warn);margin:0 0 6px;font-size:15px}.warn ul{margin:0;padding-left:20px}
.meta{font-size:13px;color:var(--mute)}.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3447b3;margin-right:6px}
.badge.g{background:#e7f7ee;color:#157347}.badge.r{background:#fdecec;color:#b42318}
.bar{height:8px;background:#e9e7df;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.step{display:flex;gap:12px;align-items:flex-start}.step.done .t{text-decoration:line-through;color:var(--mute)}.step.cur{outline:2px solid var(--acc)}
.step input{width:24px;height:24px;margin-top:3px;accent-color:var(--ok)}.t{font-weight:650}.d{margin:2px 0 8px}
details{margin-top:6px}summary{cursor:pointer;color:var(--acc);font-size:14px}.ev{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
.ask{margin-top:8px}.ans{white-space:pre-wrap;background:#f3f5ff;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.trace{font:12px/1.5 ui-monospace,Menlo,monospace;background:#101418;color:#c9d4df;border-radius:12px;padding:10px;overflow:auto;white-space:pre-wrap}
.hidden{display:none}.err{background:#fdecec;border-color:#f5b5b0;color:#7a1c14}
</style></head><body><main>
<div class="hero"><h1>Stepwise</h1><p class="sub">Learn anything hands-on, one checked step at a time. Warnings first, help when you're stuck, AR guide for paper folds.</p></div>
<div class="row"><input id="q" type="text" placeholder="Paste a link or type a topic"><button id="go">Teach me</button></div>
<h2 class="sec">Try a built-in guide</h2><div class="chips" id="chips"></div>
<div id="status" class="meta"></div>
<div id="out"></div>
</main>
<script src="presets.js"></script><script src="app.js"></script></body></html>
